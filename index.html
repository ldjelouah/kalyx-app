<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalyx · pronostics football</title>
  <meta name="description" content="Pronostics football du jour : 1N2, remboursé si nul, les deux marquent, plus de 1,5 et 2,5 buts, tirs et tirs cadrés.">
  <meta name="theme-color" content="#0f1614" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalyx">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1 id="title">Pronostics du jour</h1>
        <p id="sub">Chargement…</p>
      </div>
      <button id="install" class="install" type="button" hidden>Installer l'app</button>
    </header>
    <p id="install-hint" class="notice hint" hidden>
      <span id="install-hint-text"></span>
      <button id="install-hint-close" type="button" aria-label="Masquer">×</button>
    </p>
    <nav class="days" aria-label="Changer de jour">
      <button id="prev" type="button" disabled>← Veille</button>
      <span id="day-label"></span>
      <button id="next" type="button" disabled>Lendemain →</button>
    </nav>
    <p id="notice" class="notice" hidden></p>
    <div id="filters" class="filters" role="group" aria-label="Filtrer les matchs"></div>
    <main id="list" class="list" aria-live="polite"></main>
    <footer id="foot"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
